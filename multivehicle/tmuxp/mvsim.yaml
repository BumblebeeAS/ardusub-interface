# tmuxp session for the multivehicle SIMULATOR (run INSIDE the multivehicle_sim
# container). Brings up the whole sim — the world, all three vehicles, and the
# dashboard — but NOT the example apps (missions, controllers, the PX4 offboard
# flight demo). Load with:
#
#   tmuxp load /root/HOST/mvsim_ws/src/examples/multivehicle/tmuxp/mvsim.yaml
#
# Every command is PRE-TYPED but NOT executed (enter: false) so you start them in
# dependency order and watch each one come up:
#
#   1) world      — bring up Gazebo + the course first
#   2) bluerov    — attach the ArduSub BlueROV2 to the running world
#   3) boat       — spawn the BlueBoat USV into the running world
#   4) drone      — uXRCE-DDS agent + PX4 SITL x500 + gz<->ROS bridge (-> /x500/odom)
#   5) dashboard  — MQTT broker (:1883) + web backend (:8080) + monitor + sim-side bridges
#
#   WS_DIR=/root/HOST/my_ws tmuxp load .../mvsim.yaml

session_name: mvsim

# Mouse support (scroll/select/resize) + large scrollback history.
global_options:
  mouse: 'on'
  history-limit: 50000

# Sourced in every pane before its pre-typed command.
shell_command_before:
  - 'WS_DIR="${WS_DIR:-/root/HOST/mvsim_ws}"'
  - 'PX4_DIR="${PX4_DIR:-/root/px4}"'
  # NVIDIA PRIME render offload — auto-enabled when an NVIDIA GPU is passed through
  # (rocker --nvidia mounts /dev/nvidia0). Harmless / skipped on non-NVIDIA hosts.
  - '[ -e /dev/nvidia0 ] && export __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia || true'
  - source /opt/ros/jazzy/setup.bash
  - 'if [ -f "$WS_DIR/install/setup.bash" ]; then source "$WS_DIR/install/setup.bash"; else echo "WARNING: $WS_DIR/install/setup.bash not found - build first: colcon build --symlink-install"; fi'
  - cd "$WS_DIR"

windows:
  # 1. Gazebo world (start this first).
  - window_name: world
    focus: true
    panes:
      - shell_command:
          - cmd: ros2 launch multivehicle_sim world.launch.py world_name:=robotx_2026_sg_river
            enter: false

  # 2. BlueROV2 — spawn + ArduSub SITL + MAVROS + ros<->gz bridge. Attaches to
  #    the running world.
  - window_name: bluerov
    panes:
      - shell_command:
          - cmd: ros2 launch multivehicle_sim bluerov.launch.py
            enter: false

  # 3. BlueBoat USV — spawn into the running world (+ groundtruth odom bridge).
  - window_name: boat
    panes:
      - shell_command:
          - cmd: ros2 launch multivehicle_sim boat.launch.py
            enter: false

  # 4. PX4 x500 drone — uXRCE-DDS agent (top), PX4 SITL standalone (middle), then
  #    the gz<->ROS bridge (bottom). Start top-to-bottom: agent first, then PX4
  #    (which spawns the x500 into the running world, visible alongside the
  #    BlueROV2 + BlueBoat and connects its uORB topics to the agent), then the
  #    bridge for groundtruth pose -> /x500/odom + front camera.
  #    SYS_AUTOSTART=4010 -> x500 with a FRONT mono camera (gz model
  #    x500_mono_cam, spawned x500_mono_cam_1 for `-i 1`). PX4_UXRCE_DDS_NS=x500
  #    namespaces its ROS 2 topics as /x500/fmu/...; PX4_GZ_MODEL_POSE places it
  #    on the pier deck (world xy 47.40,-388.95; z=3.85 = deck top + rest offset).
  - window_name: drone
    layout: even-vertical
    panes:
      - shell_command:
          - cmd: MicroXRCEAgent udp4 -p 8888
            enter: false
      - shell_command:
          - cmd: PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4010 PX4_UXRCE_DDS_NS=x500 PX4_PARAM_UXRCE_DDS_SYNCT=0 PX4_GZ_MODEL_POSE="47.40,-388.95,3.85,0,0.0" ${PX4_DIR}/px4_sitl/bin/px4 -w ${PX4_DIR}/px4_sitl/romfs -i 1
            enter: false
      - shell_command:
          - cmd: ros2 launch multivehicle_sim uav_gz.launch.py model_name:=x500_mono_cam_1
            enter: false

  # 5. Dashboard — RoboCommand MQTT broker (:1883), fake per-vehicle telemetry
  #    (ROS 2 topics the backend relays to MQTT), web backend
  #    (http://localhost:8080), a raw-frame monitor, and the sim-side
  #    LED/incident bridges (bottom) tracking all three vehicles' /…/odom.
  - window_name: dashboard
    layout: even-vertical
    panes:
      - shell_command:
          - cmd: mosquitto -c /etc/mosquitto/mosquitto.conf -v
            enter: false
      - shell_command:
          - cmd: ros2 run bb_robotx_dashboard fake_vehicle_publisher
            enter: false
      - shell_command:
          - cmd: ros2 launch bb_robotx_dashboard dashboard.launch.py
            enter: false
      - shell_command:
          - cmd: ros2 run bb_robotx_dashboard mqtt_spy
            enter: false
      - shell_command:
          - cmd: ros2 launch bb_robotx_dashboard robotx_2026_sim.launch.py bridges_pkg:=robotx_gz models_pkg:=bb_worlds auv_name:=bluerov auv_pose_topic:=/bluerov/odom asv_name:=blueboat asv_pose_topic:=/blueboat/odom uav_name:=x500 uav_pose_topic:=/x500/odom
            enter: false
